# 点餐端 App 自动发版：合入 main 后自动构建 wgt 资源包并发布
#
# 产物是 wgt（应用资源热更新包），不是 apk/ipa：wgt 本质是 `uni build -p app`
# 产物打的 zip 改后缀，HBuilderX 的「制作应用 wgt 包」也只做「build + zip」两步。
# 因此 CI（Linux）不需要 HBuilderX，用 CLI 构建 + Node 打包即可。
#
# 触发条件：
#   - push 到 main 且改动落在影响构建的路径（只改文档不会白跑一次发版）
#   - 在 Actions 页面手动点 "Run workflow"（首次部署或需要强制重建时用）
#
# 发布前需在仓库 Secrets 里配置 MEAL_PUBLISH_TOKEN，值与后端
# 「系统管理 > 参数设置」的 meal.app.publishToken 一致。
name: 点餐端自动发版（wgt）

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/build-wgt.mjs"
      - "scripts/publish-wgt-ci.mjs"
      - ".github/workflows/publish-wgt.yml"
  workflow_dispatch:

# 同一分支上新的 push 会取消进行中的旧构建，避免两次构建争抢发布
concurrency:
  group: publish-wgt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # 手动触发（workflow_dispatch）时可以选任意分支，必须在 job 层再守一道：
    # 只有 main 的提交允许发布，避免把 dev 等未完成代码发上线
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # Vite 5 要求 Node ^18 或 >=20
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 App 产物
        run: npm run build:app

      - name: 自动递增版本号、打包并发布
        env:
          # 发布令牌只存 Secrets，不写进仓库
          MEAL_PUBLISH_TOKEN: ${{ secrets.MEAL_PUBLISH_TOKEN }}
        # 以线上最新版本为基准递增版本号（写入 wgt 内 manifest，不改仓库源码）→
        # 打包并校验产物（不合格就不发）→ 调发布接口一次完成「上传 R2 + 新建版本记录」。
        # 读不到线上版本时直接失败，不按源码版本号盲目发版
        run: |
          # pipefail 不能省：否则 node 失败会被 tee 的成功退出码掩盖，发布失败却显示成功
          set -o pipefail
          node scripts/publish-wgt-ci.mjs --log "自动发布（${{ github.sha }}）" | tee publish.log
          {
            echo "## 点餐端 wgt 已发布"
            echo ""
            grep -E "^(线上最新版本|递增后版本|已上传|  versionId|  包大小)" publish.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 留存 wgt 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wgt-${{ github.sha }}
          path: dist/release/wgt/*.wgt
          if-no-files-found: warn
          retention-days: 30
